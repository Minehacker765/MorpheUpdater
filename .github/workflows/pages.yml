name: pages
on:
  push:
    branches: [main]
    paths: [out/**, icons/**, branding/**]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare icons and branding for Pages
        run: |
          mkdir -p out/icons out/branding 2>/dev/null || true
          cp -r icons/* out/icons/ 2>/dev/null || true
          cp -r branding/* out/branding/ 2>/dev/null || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v4
